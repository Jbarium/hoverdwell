# HoverDwell config
dwell_ms=1500          # hold still this long to open the menu
select_ms=900          # hold still on an item this long to run it
menu_timeout_ms=5000
menu_radius_pct=22
item_radius_pct=8
tol_px=24
tol_dist=14
post_touch_ms=300

item Recents       | input keyevent KEYCODE_APP_SWITCH
item Settings      | am start -a android.settings.SETTINGS
item Notifications | cmd statusbar expand-notifications
item Back          | input keyevent KEYCODE_BACK
item Home          | input keyevent KEYCODE_HOME
item Screenshot    | screencap -p /sdcard/Pictures/hd_$(date +%s).png
item Kill apps     | am kill-all